name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:regex
      - run: npm run test:browser-surface
      - run: npm run test:stabilization
      - run: npm run test:canonical-events
      - run: npm run test:adapter-events
      - run: npm test
      - run: cd mcp-server && npm ci --ignore-scripts
      - run: node mcp-server/test.js
      - run: node mcp-server/integration-test.js
      - run: node scripts/validate-manifests.js
      - run: npm run build
      - run: npm run test:release-artifacts
      - run: npm run test:clean-install
      - run: npm run test:windows-package
      - run: npm run test:e2e:chromium
      - run: npm run check:browser-artifact
      - name: Verify browser and server artifacts
        shell: bash
        run: |
          set -euo pipefail
          for asset in dist/maskit-chrome.zip dist/maskit-firefox.zip dist/maskit-edge.zip dist/maskit-opera.zip dist/maskit-extension.zip dist/maskit-mcp.tar.gz dist/maskit-cli.tar.gz; do test -s "$asset"; done

  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore maskit-agent/Maskit.Agent/Maskit.Agent.csproj
      - run: dotnet build maskit-agent/Maskit.Agent/Maskit.Agent.csproj --configuration Release --no-restore
      - run: dotnet run --project maskit-agent/Maskit.Agent/Maskit.Agent.csproj --configuration Release --no-build -- --parity
