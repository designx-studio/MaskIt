name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: npm test
      - run: npm run test:regex
      - run: npm run test:browser-surface
      - run: npm run test:cross-adapter-parity
      - name: Build all release artifacts (including Windows agent)
        run: npm run build
        env:
          MASKIT_REQUIRE_WINDOWS_ARTIFACT: '1'
      - name: Require full release set
        shell: bash
        run: |
          set -euo pipefail
          for asset in \
            maskit-chrome.zip \
            maskit-edge.zip \
            maskit-firefox.zip \
            maskit-cli.tar.gz \
            maskit-mcp.tar.gz \
            maskit-windows-agent.zip \
            SHA256SUMS.txt \
            RELEASE-METADATA.json
          do
            test -s "dist/$asset"
          done
          # opera + extension remain part of the browser matrix
          test -s dist/maskit-opera.zip
          test -s dist/maskit-extension.zip
      - run: npm run test:release-artifacts
        env:
          MASKIT_REQUIRE_WINDOWS_ARTIFACT: '1'
      - run: npm run test:clean-install
      - run: npm run test:windows-package
        env:
          MASKIT_REQUIRE_WINDOWS_ARTIFACT: '1'
      - run: npm run check:browser-artifact
      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/maskit-*.zip,dist/maskit-*.tar.gz,dist/SHA256SUMS.txt,dist/RELEASE-METADATA.json'
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/maskit-chrome.zip
            dist/maskit-firefox.zip
            dist/maskit-edge.zip
            dist/maskit-opera.zip
            dist/maskit-extension.zip
            dist/maskit-cli.tar.gz
            dist/maskit-mcp.tar.gz
            dist/maskit-windows-agent.zip
            dist/SHA256SUMS.txt
            dist/RELEASE-METADATA.json
